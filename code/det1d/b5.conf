# Source: bg/b5-of14/b5.conf (verbatim but for paths).
# Shows: every B5 tunable in one sourced file (fit window, threshold, tolerances, grids).
# B5 OF-14 background solves: every tunable. Bash-sourced by sod.sh, det1d.sh and dmr.sh; one-line edits, no rebuild.
FORK=repos/detonationFoam-OF14
OF14=repos/openfoam-14
FLAKE=${FLAKE:-<skuld2 flake>}   # skuld2 flake; output .#openfoam carries detonationFluid
MAX_RANKS=12

# (a) Sod on shockFluid (OF-14 tutorial shockTube, dimensional Sod)
SOD_CELLS="250 500 1000 2000 4000"
SOD_T=6.3246e-3          # Toro t* = 0.2
SOD_MAXCO=0.2          # sod.sh also takes the value as its first argument
SOD_RANKS=1
export SOD_GAMMA=1.4 SOD_CP=1004.5 SOD_PL=1e5 SOD_TL=348.432 SOD_PR=1e4 SOD_TR=278.746 SOD_X0=0
SOD_POS_TOL_CELLS=1      # pass: |position error| <= this many cells at 1000 cells
SOD_ORDER_MIN=0.6
SOD_ORDER_MAX=1.1

# (b) 1D H2-air detonation on detonationFluid
DET_LENGTH=0.025         # m
DET_DRIVER=0.002         # m, hot high-pressure driver at the closed end
DET_DRIVER_P=9118750     # Pa (90 atm)
DET_DRIVER_T=2000
DET_P0=101325
DET_T0=300
DET_PHI=1.0
DET_MECH=mech/burke2012  # .inp .therm (Cantera yaml2ck of SDToolbox Burke2012.yaml) + .transport (OpenFOAM dict)
DET_SW_LIMIT=0.024
DET_SHOCK_DETECT_P=200000
DET_SOLVER_TYPE=Euler    # inviscid for the CJ check
DET_FLUX=Kurganov
DET_LIMITERS="vanLeer Minmod"   # fork findings: Minmod decays a 1-D wave, vanLeer overshoots; run both coarse
DET_MAXCO=0.4
DET_RANKS=8
DET_CELLS="5682 11364 22727"   # 4.4, 2.2, 1.1 µm; run coarse first, its c decides the finest
DET_PROBE_DX=0.0005
DET_WRITE_INTERVAL=1e-7  # s; fields and the profile graph, newest two kept (the shock stop does not write)
DET_FIT_FROM=0.010       # shock speed fitted over probes from here to SW limit
DET_DCJ_TOL_PCT=1
DET_LIND_TOL_PCT=5

# (c) the same tube on multicomponentFluid
MC_MAXCO=0.1

# (d) double Mach reflection (Kemm 2014 setup) on shockFluid
DMR_RES="120 240 480"     # cells per unit length; three grids for the GCI band
DMR_RANKS=8
DMR_T=0.2

# strip cost probe (Kwak geometry) on detonationFluid
STRIP_LX=0.03125; STRIP_LY=0.010; STRIP_DX="2.5e-4 1.25e-4"; STRIP_T=5e-6; STRIP_RANKS=8
# strip runs reuse det1d.sh: DET_NY=<cells in y> DET_LENGTH=$STRIP_LX DET_HEIGHT=$STRIP_LY DET_END=$STRIP_T det1d.sh <nx>
